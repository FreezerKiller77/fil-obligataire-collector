name: Collecter les flux publics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', '*.yaml', 'requirements.txt', '.github/workflows/**']
  schedule:
    - cron: '3-53/10 6-21 * * 1-5'
      timezone: Europe/Paris
    - cron: '2 0-5,22-23 * * 1-5'
      timezone: Europe/Paris
    - cron: '2 * * * 0,6'
      timezone: Europe/Paris
permissions:
  contents: read
concurrency:
  group: collecte-publique
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tester
        run: python -m pytest -q
      - name: Restaurer les sept jours d’historique
        run: |
          mkdir -p state dist/data
          if git fetch origin data --depth=1; then
            git show FETCH_HEAD:snapshot.json > /tmp/previous-snapshot.json
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/previous-snapshot.json').read_text())
          Path('state/items.json').write_text(json.dumps(data['items']))
          for name in ('news','latest'):
              Path('dist/data/'+name+'.json').write_text(json.dumps({'items':[], 'last_success':data['last_success']}))
          PY
          fi
      - name: Collecter avec respect de robots.txt
        run: python run.py
      - name: Préparer le résultat public
        run: python snapshot.py
      - name: Publier le résultat
        run: |
          git config user.name 'fil-obligataire[bot]'
          git config user.email 'fil-obligataire@users.noreply.github.com'
          if git rev-parse --verify refs/remotes/origin/data >/dev/null 2>&1; then
            git worktree add /tmp/fil-data refs/remotes/origin/data
          else
            mkdir /tmp/fil-data
            git -C /tmp/fil-data init -b data
            git -C /tmp/fil-data config user.name 'fil-obligataire[bot]'
            git -C /tmp/fil-data config user.email 'fil-obligataire@users.noreply.github.com'
          fi
          cp public/snapshot.json /tmp/fil-data/snapshot.json
          git -C /tmp/fil-data add snapshot.json
          git -C /tmp/fil-data commit -m 'Actualiser les flux publics'
          git fetch /tmp/fil-data HEAD
          git push origin FETCH_HEAD:refs/heads/data
